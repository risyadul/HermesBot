[package]
name = "hermes-bot"
version = "0.1.0"
description = "A cross-platform desktop client for Hermes Agent"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hermes_bot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
